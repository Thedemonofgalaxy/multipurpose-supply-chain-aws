name: AWS CloudChain CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-validate:
    name: Build, Lint & Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite
        env:
          AWS_MODE: local
        run: |
          pytest tests/ -v

      - name: Verify Architecture Templates
        run: |
          python -c "import yaml; yaml.safe_load(open('infrastructure/cloudformation.yaml'))"
          echo "CloudFormation template syntax validated!"

  deploy-to-aws:
    name: Deploy to AWS Cloud
    needs: test-and-validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # Only runs if AWS credentials secrets are configured in GitHub repository
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Set up AWS SAM CLI
        continue-on-error: true
        uses: aws-actions/setup-sam@v2

      - name: SAM Build & Validate
        continue-on-error: true
        run: |
          sam validate -t infrastructure/cloudformation.yaml
